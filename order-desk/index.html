<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>GreenPeas — Order desk</title>
  <style>
:root {
  --ink: #222;
  --muted: #888;
  --line: #e4e4e4;
  --paper: #f7f7f7;
  --white: #fff;
  --green: #1f6b45;
  --blue: #3d7dc4;
  --blue-btn: #7eaae0;
  --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  font-size: 13px;
}

.lock {
  min-height: 100%;
  display: grid;
  place-items: center;
  background: #f3f6f8;
}
.lock-card {
  width: 420px;
  background: var(--white);
  border: 1px solid #e5e5e5;
  border-radius: 4px;
  padding: 36px 32px;
}
.lock-card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 500; }
.lock-card p { margin: 0 0 20px; color: #666; line-height: 1.45; }
.lock-card input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ccc;
  border-radius: 2px;
  font-size: 15px;
  margin-bottom: 10px;
}
.badge-priv {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #3d7dc4;
  font-weight: 700;
  margin-bottom: 10px;
}

.app { display: none; min-height: 100%; }
.app.on { display: flex !important; }

.sidebar {
  width: 200px;
  background: #fff;
  border-right: 1px solid var(--line);
  color: #333;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.brand { padding: 18px 16px 12px; border-bottom: 1px solid var(--line); }
.brand strong { display: block; font-size: 14px; font-weight: 600; }
.brand span { color: #888; font-size: 11px; }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.nav button {
  text-align: left;
  background: transparent;
  border: 0;
  color: #333;
  padding: 8px 10px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
}
.nav button:hover, .nav button.active { background: #eef4fb; color: #1a5aa8; }
.side-foot {
  margin-top: auto;
  padding: 14px 16px 18px;
  font-size: 11px;
  color: #999;
  line-height: 1.45;
}

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar h2 { margin: 0; font-size: 16px; font-weight: 500; }
.topbar .spacer { flex: 1; }

button.btn {
  border: 1px solid #d0d0d0;
  background: #f5f5f5;
  border-radius: 3px;
  padding: 7px 12px;
  cursor: pointer;
  font-size: 13px;
}
button.btn.save { background: #1f6b45; border-color: #1f6b45; color: #fff; }

.sheet-wrap { background: #fff; }
.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 4px 0 10px;
  font-size: 13px;
}
.sheet-head span { color: #888; }
.sheet {
  overflow: auto;
  max-height: calc(100vh - 160px);
  border: 1px solid #b4b4b4;
}
.sheet table { border-collapse: collapse; font-size: 11px; }
.sheet th {
  position: sticky;
  top: 0;
  background: #548235;
  color: #fff;
  font-weight: 600;
  padding: 6px 8px;
  border: 1px solid #3f6b28;
  white-space: nowrap;
}
.sheet td {
  padding: 4px 8px;
  border: 1px solid #d0d0d0;
  white-space: nowrap;
}
.station-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.lab-cop { border: 1px solid #ccc; padding: 2px 4px; }

.content { padding: 12px 20px 40px; background: #fff; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 2px;
}
.card h3 {
  margin: 0;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 650;
}
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { font-size: 12px; color: #777; font-weight: 500; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: #f6f9fc; }

/* e-conomic order canvas */
.eco-page { color: #333; }
.eco-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.eco-top h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 400;
  color: #4a4a4a;
}
.eco-balance { text-align: right; color: #888; font-size: 13px; }
.eco-balance b { display: block; color: #333; font-weight: 400; margin-top: 4px; }

.eco-grid {
  display: grid;
  grid-template-columns: 280px 1fr 300px;
  gap: 8px 28px;
  border-bottom: 1px solid #eee;
  padding-bottom: 12px;
}
.cust-add {
  width: 100%;
  height: 58px;
  border: 0;
  background: #ececec;
  color: #3d7dc4;
  font-size: 15px;
  cursor: pointer;
  text-decoration: underline;
}
.cust-no { color: #999; font-size: 12px; margin-bottom: 4px; }
.cust-name { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
.cust-addr { color: #444; line-height: 1.35; font-size: 13px; }
.pair { display: flex; gap: 28px; margin-top: 16px; }
.lbl { font-size: 12px; color: #9a9a9a; margin-bottom: 3px; }
.val { font-size: 13px; min-height: 18px; }
.val input, .notes input, .cust-addr textarea {
  border: 0;
  border-bottom: 1px solid transparent;
  padding: 0;
  font: inherit;
  width: 100%;
  background: transparent;
}
.val input:focus, .notes input:focus { border-bottom-color: #bbb; outline: 0; }
.ph { color: #bdbdbd; }

.notes-title { font-weight: 700; margin-bottom: 8px; font-size: 13px; }
.notes .nrow {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 8px;
  padding: 2px 0;
  align-items: center;
}
.notes .nrow span { color: #9a9a9a; font-size: 12px; }
.attach { margin-top: 18px; color: #9a9a9a; font-size: 12px; }

.eco-right { display: grid; grid-template-columns: 96px 1fr; gap: 14px; }
.show-order {
  width: 92px;
  height: 118px;
  border: 1px solid #ddd;
  background: linear-gradient(#fafafa, #eee);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  cursor: pointer;
  color: #fff;
}
.show-order span {
  background: #555;
  border-radius: 12px;
  padding: 4px 8px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.totals .trow { display: flex; justify-content: space-between; padding: 2px 0; color: #777; }
.totals .total {
  margin-top: 10px;
  font-size: 22px;
  color: #555;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.totals .dkk { font-size: 12px; color: #aaa; display: block; }
.layout-line { grid-column: 1 / -1; color: #888; font-size: 12px; margin-top: 8px; }
.layout-line input { width: 100%; border: 0; font: inherit; color: #888; }

.eco-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 14px 0 8px;
}
.eco-actions .right { margin-left: auto; color: #999; display: flex; gap: 10px; align-items: center; }
.ico { border: 1px solid #ddd; background: #fff; width: 32px; height: 28px; cursor: pointer; color: #666; }

.eco-lines { margin-top: 4px; }
.eco-lines table { border-top: 1px solid #e5e5e5; }
.eco-lines th {
  font-weight: 400;
  color: #888;
  font-size: 12px;
  border-bottom: 1px solid #ececec;
}
.eco-lines td { border-bottom: 1px solid #f0f0f0; padding: 9px 10px; }
.eco-lines td input {
  width: 100%;
  border: 0;
  background: transparent;
  font: inherit;
}
.eco-lines td.num { text-align: right; }
.eco-lines tr:hover { background: #f7f7f7; }
.line-foot { text-align: right; color: #999; padding: 8px 4px 0; }

.pencil { color: #ccc; font-size: 12px; margin-left: 8px; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  display: none;
  place-items: center;
  z-index: 20;
}
.modal-bg.on { display: grid; }
.modal {
  width: min(720px, 94vw);
  max-height: 82vh;
  overflow: auto;
  background: #fff;
  border-radius: 2px;
  padding: 18px;
}
.modal h3 { margin: 0 0 12px; font-weight: 500; }
.compose {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 14px;
  margin-bottom: 14px;
}
.compose label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #777; }
.compose select, .compose input {
  border: 1px solid #ccc;
  padding: 6px 8px;
  font: inherit;
  color: #333;
}

.toast {
  position: fixed;
  bottom: 18px;
  right: 18px;
  background: #333;
  color: #fff;
  padding: 10px 14px;
  border-radius: 2px;
  display: none;
  z-index: 30;
}
.toast.on { display: block; }

.hidden { display: none !important; }
.hint { color: var(--muted); font-size: 12px; padding: 10px 16px 16px; }
.kpi { display: flex; gap: 12px; margin-bottom: 16px; }
.kpi .card { flex: 1; padding: 14px 16px; }
.kpi b { display: block; font-size: 22px; font-weight: 500; }
.kpi span { color: var(--muted); }

@media print {
  .sidebar, .topbar, .eco-actions, .nav, .lock { display: none !important; }
  .app { display: block !important; }
}

  </style>
</head>

  <div class="lock" id="lock">
    <form class="lock-card" id="lockForm">
      <div class="badge-priv">Local only · stays on this PC</div>
      <h1>GreenPeas order desk</h1>
      <p id="lockCopy">Create a PIN known only to you. Data never leaves this browser.</p>
      <input id="pin1" type="password" autocomplete="new-password" placeholder="PIN (min. 4 characters)" />
      <input id="pin2" type="password" autocomplete="new-password" placeholder="Repeat PIN" />
      <button class="btn primary" type="submit" style="width:100%">Unlock</button>
      <p class="hint" id="lockErr" style="padding:8px 0 0"></p>
    </form>
  </div>
  <div class="app" id="app" style="display:none">
    <aside class="sidebar">
      <div class="brand">
        <strong>GreenPeas A/S</strong>
        <span>Order handling · private</span>
      </div>
      <nav class="nav">

        <button data-view="catalog">Catalogues</button>

        <button data-view="labels">Pallet labels</button>
        <button data-view="settings">Settings &amp; e-conomic</button>

      <div class="side-foot">Local PC only.</div>
    </aside>
    <section class="main">

        <h2 id="title">Sales orders</h2>
        <div class="spacer"></div>
        <button class="btn" id="btnImport">Import CSV</button>
        <input id="fileCsv" type="file" accept=".csv,text/csv" hidden />
        <button class="btn" id="btnLock">Lock</button>
      </header>
      <div class="content" id="content"></div>
    </section>
  </div>
  <div class="modal-bg" id="modalBg"></div>
  <div class="toast" id="toast"></div>
  <iframe id="printFrame" title="Print" aria-hidden="true" style="position:fixed;right:0;bottom:0;width:0;height:0;border:0"></iframe>

      const even = d.length % 2 ? "0" + d : d;
      for (let i = 0; i < even.length; i += 2) vals.push(Number(even.slice(i, i + 2)));
    });
    const hasLetter = /[A-Za-z]/.test(human);
    const seq = hasLetter ? encodeCodeB(human.replace(/[()]/g, "")) : encode128(vals, 105);
    return `<div class="gs1">${barsSvg(seq, height || 62)}<div class="hr">${human}</div></div>`;
  };
})(window);

const STORE = "gp.orderdesk.v3";
const PIN_KEY = "gp.orderdesk.pin";

function fmtDate(raw) {
  if (!raw) return "";
  if (/^\d{2}-\d{2}-\d{2}$/.test(raw)) {
    const [m, d, y] = raw.split("-");
    return `20${y}-${m}-${d}`;
  }
  if (/^\d{6}$/.test(raw)) {
    const dd = raw.slice(0, 2), mm = raw.slice(2, 4), yy = raw.slice(4, 6);
    return `20${yy}-${mm}-${dd}`;
  }
  return raw;
}

function money(n) {
  return Number(n || 0).toLocaleString("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 2200);
}

async function sha(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function uniqPush(list, keyFn, item) {
  const k = keyFn(item);
  if (!k || list.some((x) => keyFn(x) === k)) return;
  list.push(item);
}

function catalogsFrom(packing) {
  const customers = [];
  const products = [];
  const packings = [];
  const boxes = [];
  const pallets = [];
  const origins = [];
  const eans = [];
  packing.forEach((p) => {
    uniqPush(customers, (c) => c.id, {
      id: p.customerId,
      no: p.customerNo,
      name: p.customerName,
      delivery: p.delivery,
      address: p.address
    });
    uniqPush(products, (x) => String(x.code), {
      code: String(p.productCode),
      name: p.product
    });
    uniqPush(packings, (x) => x.name, {
      name: p.packing,
      code: String(p.packingCode || "")
    });
    uniqPush(boxes, (x) => x.name, { name: p.box });
    if (p.pallet && !pallets.includes(p.pallet)) pallets.push(p.pallet);
    if (p.origin && !origins.includes(p.origin)) origins.push(p.origin);
    if (p.ean && !eans.includes(p.ean)) eans.push(p.ean);
  });
  return { customers, products, packings, boxes, pallets, origins, eans };
}

function uid() {
  return crypto.randomUUID();
}

function boxLabel(box) {
  if (/europool/i.test(box || "")) return "EuroPool kasse " + box.replace(/europool\s*/i, "");
  return box || "Kasse";
}

function produceLabel(productName, packingName, units, origin) {
  const u = units || "";
  return `${u} x ${packingName || ""} ${productName || ""}${origin ? ", origin " + origin : ""}`
    .replace(/\s+/g, " ")
    .trim();
}

function emptyLine() {

    discount: 0,

  };
}

function linesFromPacking(p) {
  const qty = Number(p.boxes) || 0;
  return [
    {
      id: uid(),
      productNo: p.packingCode || p.box,
      productName: boxLabel(p.box),
      quantity: qty,
      unit: "Kasser",
      unitPrice: 0,
      discount: 0,
      department: ""
    },
    {
      id: uid(),
      productNo: p.ean || p.gtin || p.productCode,
      productName: produceLabel(p.product, p.packing, p.unitsPerBox, p.origin),
      quantity: qty,
      unit: "Box",
      unitPrice: 0,
      discount: 0,
      department: ""
    }
  ];
}

function saleFromPackingRows(rows) {
  const first = rows[0];
  return {
    id: uid(),
    number: first.orderNo,
    customerId: first.customerId,
    customerNo: first.customerNo,
    customerName: first.customerName,
    customerAddress: first.delivery,
    deliveryName: first.customerName,
    delivery: first.delivery,
    paymentTerms: "Netto 30 dage",
    date: fmtDate(first.orderDate),
    deliveryDate: fmtDate(first.deliveryDate),
    heading: "",
    text1: first.customerRef,
    text2: first.gtin || first.ean,
    externalId: "",
    yourRef: "",
    ourRef: "",
    ourRef2: "",
    otherRef: rows.map((r) => r.orderNo).join(", "),
    layout: "",
    currency: "DKK",
    lines: rows.flatMap(linesFromPacking)
  };
}

function salesFromPacking(packing) {
  const groups = new Map();
  packing.forEach((p) => {
    const key = p.customerId + "|" + p.deliveryDate;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  return [...groups.values()].map(saleFromPackingRows);
}

function defaultState() {
  const packing = GP_SEED.packing;
  return {
    packing,
    ...catalogsFrom(packing),
    sales: [],
    activeSale: null
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) return JSON.parse(raw);
  } catch (_) {}
  return defaultState();
}

let state = loadState();

function save() {
  localStorage.setItem(STORE, JSON.stringify(state));
}

function customerById(id) {
  return state.customers.find((c) => c.id === id);
}

function lineTotal(l) {
  const q = Number(l.quantity) || 0;
  const p = Number(l.unitPrice) || 0;
  const d = Number(l.discount) || 0;
  return q * p * (1 - d / 100);
}

function saleTotals(sale) {
  const sub = (sale.lines || []).reduce((s, l) => s + lineTotal(l), 0);
  const vat = sub * 0.25;
  return { sub, vat, total: sub + vat };
}

const lock = document.getElementById("lock");
const app = document.getElementById("app");
const pin1 = document.getElementById("pin1");
const pin2 = document.getElementById("pin2");
const lockCopy = document.getElementById("lockCopy");
const lockErr = document.getElementById("lockErr");

function showApp() {
  lock.style.display = "none";
  app.classList.add("on");
  sessionStorage.setItem(SESSION, "1");
  render();
}

function showLock(setup) {
  lock.style.display = "grid";
  app.classList.remove("on");
  pin2.classList.toggle("hidden", !setup);
  lockCopy.textContent = setup
    ? "Create a PIN known only to you. Customer, product and order data never leave this browser."
    : "Enter your PIN. This desk is local to this computer.";
}

async function initLock() {
  const existing = localStorage.getItem(PIN_KEY);
  if (sessionStorage.getItem(SESSION) === "1" && existing) {
    showApp();
    return;
  }
  showLock(!existing);
}

document.getElementById("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  lockErr.textContent = "";
  const existing = localStorage.getItem(PIN_KEY);
  if (!existing) {
    if ((pin1.value || "").length < 4) {
      lockErr.textContent = "PIN must be at least 4 characters.";
      return;
    }
    if (pin1.value !== pin2.value) {
      lockErr.textContent = "PINs do not match.";
      return;
    }
    localStorage.setItem(PIN_KEY, await sha(pin1.value));
    pin1.value = pin2.value = "";
    showApp();
    return;
  }
  if ((await sha(pin1.value)) !== existing) {
    lockErr.textContent = "Wrong PIN.";
    return;
  }
  pin1.value = "";
  showApp();
});

document.getElementById("btnLock").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION);
  pin1.value = "";
  showLock(false);
});

function persistSale(sale) {
  if (!sale) return;
  if (!sale.number) {
    const nums = state.sales.map((s) => parseInt(s.number, 10)).filter((n) => n > 0);

function saleToExcelRows(sale) {
  const rows = [];
  const lines = sale.lines || [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const next = lines[i + 1];
    let crate = null;
    let prod = null;
    if (l.unit === "Kasser" && next && next.unit === "Box") {
      crate = l;
      prod = next;
      i += 1;
    } else if (l.unit === "Box") prod = l;
    else crate = l;
    const qty = Number((crate || prod).quantity) || 0;
    const bpp = Number((crate || prod).boxesPerPallet) || 0;
    const units = Number((prod || crate || {}).unitsPerBox) || "";
    rows.push({
      source: "Saved",
      orderNo: sale.number,
      customerName: sale.customerName,
      boxes: qty,
      floorPallets: bpp ? 1 : "",
      totalPallets: bpp ? Math.ceil(qty / bpp) : "",
      pallet: (crate || prod).pallet || "",
      boxesPerPallet: bpp || "",
      box: (crate || prod).boxName || (crate && crate.productName) || "",
      unitsPerBox: units,
      packing: (prod || {}).packingName || "",
      packingCode: (crate || prod).packingCode || "",
      product: (prod || {}).productNameRaw || (prod && prod.productName) || "",
      productCode: (prod || {}).productCode || "",
      origin: (prod || crate || {}).origin || "",
      ean: (prod && prod.productNo) || "",
      gtin: (prod || {}).gtin || (prod && prod.productNo) || "",
      lot: (prod || crate || {}).lot || "",
      dessin: (prod || crate || {}).dessin || "",
      bbd: (prod || crate || {}).bbd || "",
      headline: `${qty} x ${units || ""} ${(prod || {}).productNameRaw || ""} ${(prod || {}).packingName || ""}`.replace(/\s+/g, " ").trim(),
      customerNo: sale.customerNo,
      customerId: sale.customerId,
      customerRef: sale.text1 || sale.yourRef,
      internalRef: sale.ourRef,
      orderDate: sale.date,
      deliveryDate: sale.deliveryDate,
      delivery: sale.delivery,
      address: sale.customerAddress,
      netKg: (prod || crate || {}).netKg || "",
      description: prod ? prod.productName : (crate && crate.productName) || ""
    });
  }
  return rows;
}

  return {

  });

function parseCsv(text) {
  const lines = text.split(/\r?\n/);
  let headerIdx = lines.findIndex((l) => l.toLowerCase().includes("order no") && l.toLowerCase().includes("customer"));
  if (headerIdx < 0) headerIdx = 0;
  const split = (row) => row.split(";").map((c) => c.trim());
  const headers = split(lines[headerIdx]);
  const idx = (name) => headers.findIndex((h) => h.toLowerCase() === name.toLowerCase());
  const packing = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const cols = split(lines[i]);
    if (!cols[0] || !/^\d+$/.test(cols[0])) continue;
    const g = (n) => cols[idx(n)] || "";
    packing.push({
      orderNo: g("Order no."),
      customerName: g("Customer name"),
      boxes: Number(g("No of boxes")) || 0,
      floorPallets: Number(g("Floor pallets")) || 0,
      totalPallets: Number(g("Total pallets")) || 0,
      pallet: g("Pallet name"),
      boxesPerPallet: Number(g("Boxes per pallet")) || 0,
      box: g("Box name"),
      unitsPerBox: Number(g("Units per box")) || 0,
      packing: g("Packing name"),
      product: g("Product name"),
      lot: g("Lot no."),
      orderDate: g("Order date"),
      packingDate: g("Packing date"),
      deliveryDate: g("Delivery date"),
      internalRef: g("Internal reference"),
      customerRef: g("Customer reference"),
      customerNo: g("Customer no."),
      customerId: String(g("Customer ID")).replace(/\.$/, ""),
      packingCode: String(Number(g("Packing  code") || g("Packing code")) || ""),
      origin: g("Origin"),
      productCode: String(Number(g("Product code")) || g("Product code")),
      ean: g("EAN"),
      gtin: g("GTIN"),
      finalGtin: g("Final GTIN"),
      sscc: g("SSCC"),
      warehouseNo: String(Number(g("Warehouse no.")) || 1),
      shipFrom: g("Departure warehouse"),
      address: g("Address"),
      delivery: g("Delivery address"),
      bbd: g("Best before"),
      description: g("Final description"),
      dessin: g("Dessin"),
      netKg: Number(g("Net weight in Kg")) || 0,
      packingDay: g("Packing day no.")
    });
  }
  return packing;
}

function compactDate(raw) {
  if (!raw) return "";
  if (/^\d{6}$/.test(raw)) return raw;
  const iso = fmtDate(raw);
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + m[2] + m[1].slice(2);
  return raw;
}

function barcodeHtml(text) {
  const payload = ("*" + String(text || "").toUpperCase().replace(/[^0-9A-Z. -]/g, "") + "*").slice(0, 24);
  let html = '<div class="bc">';
  [...payload].forEach((ch) => {
    const pat = C39[ch] || C39[0];
    [...pat].forEach((bit) => {
      html += `<i class="${bit === "w" ? "bar w" : "bar n"}"></i>`;
    });
    html += '<i class="bar gap"></i>';
  });
  html += `</div><div class="bc-text">${esc(text)}</div>`;
  return html;
}

function openPrint(inner, kind) {
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print</title>
    <style>
      body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; color: #111; }
      ${kind === "label" ? labelPrintCss() : orderPrintCss()}
    </style></head><body class="${kind}">${inner}</body></html>`;
  let frame = document.getElementById("printFrame");
  if (!frame) {
    frame = document.createElement("iframe");
    frame.id = "printFrame";
    frame.setAttribute("aria-hidden", "true");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;";
    document.body.appendChild(frame);
  }
  const doc = frame.contentWindow && frame.contentWindow.document;
  if (!doc) {
    toast("Could not open the print view");
    return;
  }
  doc.open();
  doc.write(html);
  doc.close();
  setTimeout(() => {
    frame.contentWindow.focus();
    frame.contentWindow.print();
  }, 400);
}

function addrFrames(row) {
  const co = company();
  return `
    <div class="cap">From</div>

    <div class="cap">To</div>
    <div class="frame">
      <div class="to-name">${esc(row.customerName)}</div>
      <div class="to-addr">${esc(row.delivery)}</div>
    </div>`;
}

function padGtin(g) {
  const d = String(g || "").replace(/\D/g, "");
  if (!d) return "";
  return d.padStart(14, "0").slice(-14);
}

function gs1CheckDigit(numStr) {
  const d = String(numStr).replace(/\D/g, "");
  let sum = 0;
  let mul = 3;
  for (let i = d.length - 1; i >= 0; i--) {
    sum += Number(d[i]) * mul;
    mul = mul === 3 ? 1 : 3;
  }
  return String((10 - (sum % 10)) % 10);
}

function makeSscc(row, palletNo) {
  const gln = String(row.gln || company().gln || "15712515").replace(/\D/g, "").slice(0, 8);
  const order = String(row.orderNo || "0").replace(/\D/g, "").padStart(4, "0").slice(-4);
  const serial = String(palletNo).padStart(2, "0");
  const body = (gln + "250" + order + serial).slice(0, 17);
  return body + gs1CheckDigit(body);
}

function enrichPacking(row) {
  const r = { ...row };
  const hit = (state.packing || []).find(
    (p) =>
      String(p.orderNo) === String(r.orderNo) ||
      (p.product === r.product && p.box === r.box && p.customerName === r.customerName)
  );
  if (hit) {
    r.gtin = r.gtin || hit.gtin || hit.finalGtin;
    r.ean = r.ean || hit.ean;
    r.dessin = r.dessin || hit.dessin;
    r.lot = r.lot || hit.lot;
    r.bbd = r.bbd || hit.bbd;
    r.origin = r.origin || hit.origin;
    r.boxesPerPallet = r.boxesPerPallet || hit.boxesPerPallet;
    r.floorPallets = r.floorPallets || hit.floorPallets;
    r.totalPallets = r.totalPallets || hit.totalPallets;
    r.pallet = r.pallet || hit.pallet;
    r.unitsPerBox = r.unitsPerBox || hit.unitsPerBox;
    r.packing = r.packing || hit.packing;
    r.box = r.box || hit.box;
    r.netKg = r.netKg || hit.netKg;
    r.gln = r.gln || hit.gln;
    r.customerRef = r.customerRef || hit.customerRef;
    r.delivery = r.delivery || hit.delivery;
  }
  return r;
}

function printPalletLabels(rows) {
  const parts = [];
  (rows || []).forEach((raw) => {
    const row = enrichPacking(raw);
    const n = Math.max(1, Number(row.totalPallets) || 1);
    parts.push(deliveryNoteHtml(row));
    for (let i = n; i >= 1; i--) parts.push(gs1PalletHtml(row, i, n));
    parts.push(packingListHtml(row));
  });
  if (!parts.length) {
    toast("No pallet rows to print");
    return;
  }
  openPrint(parts.join(""), "label");
}

function ecoUrl(path) {
  if (location.protocol === "http:" && location.hostname === "127.0.0.1") return "/eco" + path;
  return "https://restapi.e-conomic.com" + path;
}

async function ecoFetch(path, opts = {}) {
  const eco = loadSet().eco || {};
  const res = await fetch(ecoUrl(path), {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-AppSecretToken": eco.app || "demo",
      "X-AgreementGrantToken": eco.grant || "demo",
      ...(opts.headers || {})
    }
  });
  const text = await res.text();
  let data = null;
  try {
    data = JSON.parse(text);
  } catch (_) {
    data = { raw: text };
  }
  if (!res.ok) throw new Error((data && (data.message || data.error)) || res.status);
  return data;
}
