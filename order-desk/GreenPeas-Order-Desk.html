<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>GreenPeas — Local order desk</title>
  <style>
:root {
  --ink: #1a1f1c;
  --muted: #5c675f;
  --line: #d9ded8;
  --paper: #f4f5f3;
  --white: #fff;
  --green: #1f6b45;
  --green-d: #164e32;
  --blue: #1a66c7;
  --blue-s: #e8f1fc;
  --warn: #9a3412;
  --shadow: 0 1px 2px rgba(20, 30, 24, 0.06);
  --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  font-size: 13px;
}

.lock {
  min-height: 100%;
  display: grid;
  place-items: center;
  background: linear-gradient(160deg, #143326, #1f6b45 55%, #0e241b);
}
.lock-card {
  width: 420px;
  background: var(--white);
  border-radius: 12px;
  padding: 36px 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,.25);
}
.lock-card h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
.lock-card p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
.lock-card input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 15px;
  margin-bottom: 10px;
}
.badge-priv {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--green);
  font-weight: 700;
  margin-bottom: 10px;
}

.app { display: none; min-height: 100%; }
.app.on { display: flex !important; }

.sidebar {
  width: 220px;
  background: #12261c;
  color: #e8eee9;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.brand { padding: 22px 18px 16px; border-bottom: 1px solid #1e3b2d; }
.brand strong { display: block; font-size: 15px; }
.brand span { color: #9cb8a8; font-size: 11px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
.nav button {
  text-align: left;
  background: transparent;
  border: 0;
  color: #d5e4db;
  padding: 9px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.nav button:hover, .nav button.active { background: #1d4633; color: #fff; }
.side-foot {
  margin-top: auto;
  padding: 14px 16px 18px;
  font-size: 11px;
  color: #8eaa9b;
  line-height: 1.45;
}

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 10px 22px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar h2 { margin: 0; font-size: 18px; font-weight: 500; }
.topbar .spacer { flex: 1; }

button.btn {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 4px;
  padding: 7px 12px;
  cursor: pointer;
  font-size: 13px;
}
button.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
button.btn.ghost { background: #eef1ef; }
button.btn.danger { color: var(--warn); }
button.btn:disabled { opacity: .5; cursor: default; }

.content { padding: 18px 22px 40px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.card h3 {
  margin: 0;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 650;
}
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: #f3f8f5; }
tr.selected { background: #e8f1fc; }

/* e-conomic-like order */
.eco {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.eco-head {
  display: grid;
  grid-template-columns: 240px 1fr 280px;
  gap: 0;
  border-bottom: 1px solid var(--line);
}
.eco-col { padding: 16px 18px; }
.eco-col + .eco-col { border-left: 1px solid var(--line); }
.cust-btn {
  width: 100%;
  min-height: 52px;
  border: 1px solid #cfd6d1;
  background: #eef1ef;
  color: var(--blue);
  font-size: 14px;
  cursor: pointer;
  border-radius: 2px;
}
.cust-btn.filled {
  background: #fff;
  color: var(--ink);
  text-align: left;
  padding: 10px 12px;
}
.cust-btn.filled small { display: block; color: var(--muted); font-weight: 400; }
.meta-row { display: flex; gap: 24px; margin-top: 14px; }
.meta-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.meta-row input, .meta-row select, textarea {
  border: 0;
  border-bottom: 1px solid #bbb;
  padding: 4px 0;
  font: inherit;
  background: transparent;
  width: 140px;
}
.notes label { display: block; font-size: 11px; color: var(--muted); }
.notes .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.notes input { flex: 1; width: auto; }
.totals { font-variant-numeric: tabular-nums; }
.totals .row { display: flex; justify-content: space-between; padding: 4px 0; color: var(--muted); }
.totals .grand { font-size: 22px; color: var(--ink); font-weight: 500; margin-top: 10px; }
.totals .dkk { font-size: 12px; color: #888; }
.preview {
  width: 88px;
  height: 110px;
  border: 1px solid var(--line);
  background: #fafafa;
  display: grid;
  place-items: center;
  color: var(--blue);
  font-size: 12px;
  cursor: pointer;
  margin-bottom: 8px;
}

.eco-actions {
  padding: 12px 18px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.eco-actions .right { margin-left: auto; color: var(--muted); }

.lines th { position: sticky; top: 0; background: #fff; }
.lines td input {
  width: 100%;
  border: 0;
  background: transparent;
  font: inherit;
  padding: 2px 0;
}
.lines td.num { text-align: right; }
.lines .icon-del { color: #999; cursor: pointer; border: 0; background: none; }

.pack-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 18px 14px;
  background: #fafbfa;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}
.chip {
  background: #eef6f1;
  border: 1px solid #d3e6da;
  border-radius: 999px;
  padding: 3px 10px;
  color: var(--green-d);
}

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(18, 28, 22, .45);
  display: none;
  place-items: center;
  z-index: 20;
}
.modal-bg.on { display: grid; }
.modal {
  width: min(720px, 94vw);
  max-height: 82vh;
  overflow: auto;
  background: #fff;
  border-radius: 8px;
  padding: 18px 18px 16px;
}
.modal h3 { margin: 0 0 12px; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 10px; }

.toast {
  position: fixed;
  bottom: 18px;
  right: 18px;
  background: #12261c;
  color: #fff;
  padding: 10px 14px;
  border-radius: 6px;
  display: none;
  z-index: 30;
}
.toast.on { display: block; }

.print-sheet { display: none; }
@media print {
  .sidebar, .topbar, .eco-actions, .nav, .lock, button { display: none !important; }
  .app { display: block !important; }
  .print-sheet, .eco { display: block; }
}

.hidden { display: none !important; }
.hint { color: var(--muted); font-size: 12px; padding: 10px 16px 16px; }
.kpi { display: flex; gap: 12px; margin-bottom: 16px; }
.kpi .card { flex: 1; padding: 14px 16px; }
.kpi b { display: block; font-size: 22px; }
.kpi span { color: var(--muted); }

</head>

        <button class="btn" id="btnLock">Lock</button>

      <div class="content" id="content"></div>

const STORE = "gp.orderdesk.v1";
const PIN_KEY = "gp.orderdesk.pin";
const SESSION = "gp.orderdesk.session";

function fmtDate(raw) {
  if (!raw) return "";
  if (/^\d{2}-\d{2}-\d{2}$/.test(raw)) {
    const [m, d, y] = raw.split("-");
    return `20${y}-${m}-${d}`;
  }
  if (/^\d{6}$/.test(raw)) {
    const dd = raw.slice(0, 2), mm = raw.slice(2, 4), yy = raw.slice(4, 6);
    return `20${yy}-${mm}-${dd}`;
  }
  return raw;
}

function money(n) {
  return Number(n || 0).toLocaleString("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 2200);
}

async function sha(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function catalogsFrom(packing) {
  const customers = [];
  const seenC = new Set();
  packing.forEach((p) => {
    const key = p.customerId + "|" + p.customerName;
    if (seenC.has(key)) return;
    seenC.add(key);
    customers.push({
      id: p.customerId,
      no: p.customerNo,
      name: p.customerName,
      delivery: p.delivery,
      address: p.address,
      gln: p.gln || window.GP_SEED.company.gln
    });
  });
  const products = [];
  const seenP = new Set();
  packing.forEach((p) => {
    const key = [p.productCode, p.ean, p.box, p.packing].join("|");
    if (seenP.has(key)) return;
    seenP.add(key);
    products.push({
      code: String(p.productCode),
      name: p.product,
      packing: p.packing,
      packingCode: String(p.packingCode),
      box: p.box,
      unitsPerBox: p.unitsPerBox,
      pallet: p.pallet,
      boxesPerPallet: p.boxesPerPallet,
      ean: p.ean,
      gtin: p.gtin,
      origin: p.origin,
      dessin: p.dessin,
      description: p.description,
      unit: "krt"
    });
  });
  const boxes = [...new Set(packing.map((p) => p.box))];
  const pallets = [...new Set(packing.map((p) => p.pallet))];
  return { customers, products, boxes, pallets };
}

function lineFromPacking(p, idx) {
  return {
    id: crypto.randomUUID(),
    lineNo: (idx + 1) * 1,
    productNo: String(p.productCode),
    productName: p.product,
    quantity: Number(p.boxes),
    unit: "krt",
    unitPrice: 0,
    discount: 0,
    department: "Packing",
    box: p.box,
    packing: p.packing,
    pallet: p.pallet,
    unitsPerBox: p.unitsPerBox,
    boxesPerPallet: p.boxesPerPallet,
    ean: p.ean,
    gtin: p.gtin,
    lot: p.lot,
    origin: p.origin,
    sscc: p.sscc,
    bbd: fmtDate(p.bbd),
    netKg: p.netKg,
    description: p.description,
    packingOrder: p.orderNo
  };
}

function salesFromPacking(packing) {
  const groups = new Map();
  packing.forEach((p) => {
    const key = p.customerId + "|" + p.deliveryDate;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  const sales = [];
  groups.forEach((rows) => {
    const first = rows[0];
    sales.push({
      id: crypto.randomUUID(),
      number: "S-" + first.orderNo,
      customerId: first.customerId,
      customerNo: first.customerNo,
      customerName: first.customerName,
      delivery: first.delivery,
      paymentTerms: "Netto 14 dage",
      date: fmtDate(first.orderDate),
      deliveryDate: fmtDate(first.deliveryDate),
      yourRef: first.customerRef,
      ourRef: first.internalRef && first.internalRef !== "0" ? first.internalRef : first.orderNo,
      otherRef: rows.map((r) => r.orderNo).join(", "),
      heading: "Sales order",
      layout: "Order",
      currency: "DKK",
      lines: rows.map(lineFromPacking)
    });
  });
  return sales;
}

function defaultState() {
  const packing = GP_SEED.packing;
  return {
    packing,
    ...catalogsFrom(packing),
    sales: salesFromPacking(packing),
    activeSale: null
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) return JSON.parse(raw);
  } catch (_) {}
  return defaultState();
}

let state = loadState();

function save() {
  localStorage.setItem(STORE, JSON.stringify(state));
}

function customerById(id) {
  return state.customers.find((c) => c.id === id);
}

function lineTotal(l) {
  const q = Number(l.quantity) || 0;
  const p = Number(l.unitPrice) || 0;
  const d = Number(l.discount) || 0;
  return q * p * (1 - d / 100);
}

function saleTotals(sale) {
  const sub = (sale.lines || []).reduce((s, l) => s + lineTotal(l), 0);
  const vat = sub * 0.25;
  return { sub, vat, total: sub + vat };
}

/* ---- lock ---- */
const lock = document.getElementById("lock");
const app = document.getElementById("app");
const pin1 = document.getElementById("pin1");
const pin2 = document.getElementById("pin2");
const lockCopy = document.getElementById("lockCopy");
const lockErr = document.getElementById("lockErr");

function showApp() {
  lock.style.display = "none";
  app.classList.add("on");
  sessionStorage.setItem(SESSION, "1");
  render();
}

function showLock(setup) {
  lock.style.display = "grid";
  app.classList.remove("on");
  pin2.classList.toggle("hidden", !setup);
  lockCopy.textContent = setup
    ? "Create a PIN known only to you. Customer, product and order data never leave this browser."
    : "Enter your PIN. This desk is local to this computer.";
}

async function initLock() {
  const existing = localStorage.getItem(PIN_KEY);
  if (sessionStorage.getItem(SESSION) === "1" && existing) {
    showApp();
    return;
  }
  showLock(!existing);
}

document.getElementById("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  lockErr.textContent = "";
  const existing = localStorage.getItem(PIN_KEY);
  if (!existing) {
    if ((pin1.value || "").length < 4) {
      lockErr.textContent = "PIN must be at least 4 characters.";
      return;
    }
    if (pin1.value !== pin2.value) {
      lockErr.textContent = "PINs do not match.";
      return;
    }
    localStorage.setItem(PIN_KEY, await sha(pin1.value));
    pin1.value = pin2.value = "";
    showApp();
    return;
  }
  if ((await sha(pin1.value)) !== existing) {
    lockErr.textContent = "Wrong PIN.";
    return;
  }
  pin1.value = "";
  showApp();
});

document.getElementById("btnLock").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION);
  pin1.value = "";
  showLock(false);
});

/* ---- nav ---- */
let view = "orders";
document.querySelectorAll(".nav button").forEach((b) => {
  b.addEventListener("click", () => {
    view = b.dataset.view;
    document.querySelectorAll(".nav button").forEach((x) => x.classList.toggle("active", x === b));
    if (view === "new") {
      state.activeSale = blankSale();
      view = "editor";

});

function blankSale() {
  return {
    id: crypto.randomUUID(),
    number: "S-NEW",
    customerId: "",
    customerNo: "",
    customerName: "",
    delivery: "",
    paymentTerms: "Netto 14 dage",
    date: new Date().toISOString().slice(0, 10),
    deliveryDate: "",
    yourRef: "",
    ourRef: "",
    otherRef: "",
    heading: "Sales order",
    layout: "Order",
    currency: "DKK",
    lines: []
  };
}

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function render() {
  const titles = {
    orders: "Sales orders",
    editor: "Order",
    catalog: "Clients, products & boxes",
    packing: "Packing source"
  };
  document.getElementById("title").textContent = titles[view] || "Order";
  const el = document.getElementById("content");
  if (view === "orders") el.innerHTML = renderList();
  else if (view === "editor") el.innerHTML = renderEditor();
  else if (view === "catalog") el.innerHTML = renderCatalog();
  else el.innerHTML = renderPacking();
  bindView();
}

function bindView() {
  document.querySelectorAll("[data-open]").forEach((tr) => {
    tr.addEventListener("click", () => {
      state.activeSale = state.sales.find((s) => s.id === tr.dataset.open);
      view = "editor";
      document.querySelectorAll(".nav button").forEach((x) => x.classList.remove("active"));
      render();
    });
  });
  const sale = state.activeSale;
  if (view !== "editor" || !sale) return;

  const persistHead = () => {
    sale.paymentTerms = document.getElementById("fTerms").value;
    sale.date = document.getElementById("fDate").value;
    sale.delivery = document.getElementById("fDeliv").value;
    sale.heading = document.getElementById("fHead").value;
    sale.yourRef = document.getElementById("fYref").value;
    sale.ourRef = document.getElementById("fOref").value;
    sale.otherRef = document.getElementById("fXref").value;
    sale.layout = document.getElementById("fLay").value;
  };
  ["fTerms", "fDate", "fDeliv", "fHead", "fYref", "fOref", "fXref", "fLay"].forEach((id) => {
    const n = document.getElementById(id);
    if (n) n.addEventListener("change", persistHead);
  });
  document.querySelectorAll("tr[data-line] input").forEach((inp) => {
    inp.addEventListener("change", () => {
      const id = inp.closest("tr").dataset.line;
      const line = sale.lines.find((l) => l.id === id);
      const f = inp.dataset.f;
      line[f] = inp.type === "number" ? Number(inp.value) : inp.value;
      save();
      render();
    });
  });
  document.querySelectorAll("[data-del]").forEach((b) => {
    b.addEventListener("click", () => {
      sale.lines = sale.lines.filter((l) => l.id !== b.dataset.del);
      save();
      render();
    });
  });
  document.getElementById("pickCust")?.addEventListener("click", pickCustomer);
  document.getElementById("btnNewLine")?.addEventListener("click", pickProduct);
  document.getElementById("btnSave")?.addEventListener("click", () => {
    persistHead();
    const i = state.sales.findIndex((x) => x.id === sale.id);
    if (i >= 0) state.sales[i] = sale;
    else state.sales.unshift(sale);
    save();
    toast("Saved on this PC only");
  });
  document.getElementById("btnPrint")?.addEventListener("click", () => window.print());
  document.getElementById("btnPdf")?.addEventListener("click", () => window.print());
}

function openModal(html, after) {
  const bg = document.getElementById("modalBg");
  bg.classList.add("on");
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.querySelector(".modal").addEventListener("click", (e) => e.stopPropagation());
  bg.onclick = () => bg.classList.remove("on");
  after?.(bg);
}

function pickCustomer() {
  openModal(
    `<h3>Customers</h3><input class="search" id="q" placeholder="Search name, number, ID…" />
     <div class="table-wrap"><table><tbody id="pickBody"></tbody></table></div>`,
    (bg) => {
      const draw = () => {
        const q = (bg.querySelector("#q").value || "").toLowerCase();
        bg.querySelector("#pickBody").innerHTML = state.customers
          .filter((c) => `${c.name} ${c.no} ${c.id}`.toLowerCase().includes(q))
          .map(
            (c) => `<tr class="clickable" data-id="${esc(c.id)}"><td>${esc(c.no)}</td><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.delivery)}</td></tr>`
          )
          .join("");
        bg.querySelectorAll("[data-id]").forEach((tr) => {
          tr.onclick = () => {
            const c = customerById(tr.dataset.id);
            Object.assign(state.activeSale, {
              customerId: c.id,
              customerNo: c.no,
              customerName: c.name,
              delivery: c.delivery
            });
            bg.classList.remove("on");
            render();
          };
        });
      };
      bg.querySelector("#q").oninput = draw;
      draw();
    }
  );
}

function pickProduct() {
  openModal(
    `<h3>Add order line from catalogue</h3>
     <input class="search" id="q" placeholder="Search product, box, EAN, packing…" />
     <div class="table-wrap"><table>
       <thead><tr><th>No.</th><th>Name</th><th>Packing</th><th>Box</th><th>EAN</th></tr></thead>
       <tbody id="pickBody"></tbody></table></div>`,
    (bg) => {
      const draw = () => {
        const q = (bg.querySelector("#q").value || "").toLowerCase();
        bg.querySelector("#pickBody").innerHTML = state.products
          .filter((p) => `${p.code} ${p.name} ${p.box} ${p.ean} ${p.packing}`.toLowerCase().includes(q))
          .map(
            (p, i) => `<tr class="clickable" data-i="${i}" data-code="${esc(p.code)}" data-ean="${esc(p.ean)}" data-box="${esc(p.box)}">
              <td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.packing)}</td><td>${esc(p.box)}</td><td>${esc(p.ean)}</td></tr>`
          )
          .join("");
        bg.querySelectorAll("#pickBody tr").forEach((tr) => {
          tr.onclick = () => {
            const p = state.products.find(
              (x) => x.code === tr.dataset.code && x.ean === tr.dataset.ean && x.box === tr.dataset.box
            );
            const sale = state.activeSale;
            sale.lines.push({
              id: crypto.randomUUID(),
              lineNo: sale.lines.length + 1,
              productNo: p.code,
              productName: p.name,
              quantity: p.boxesPerPallet || 1,
              unit: p.unit,
              unitPrice: 0,
              discount: 0,
              department: "Packing",
              box: p.box,
              packing: p.packing,
              pallet: p.pallet,
              unitsPerBox: p.unitsPerBox,
              boxesPerPallet: p.boxesPerPallet,
              ean: p.ean,
              gtin: p.gtin,
              lot: "",
              origin: p.origin,
              sscc: "",
              bbd: "",
              netKg: "",
              description: p.description,
              packingOrder: ""
            });
            bg.classList.remove("on");
            render();
          };
        });
      };
      bg.querySelector("#q").oninput = draw;
      draw();
    }
  );
}

document.getElementById("btnImport").addEventListener("click", () => document.getElementById("fileCsv").click());
document.getElementById("fileCsv").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const text = await file.text();
  const packing = parseCsv(text);
  if (!packing.length) {
    toast("No order rows found");
    return;
  }
  state.packing = packing;
  Object.assign(state, catalogsFrom(packing));
  state.sales = salesFromPacking(packing);
  save();
  toast("Imported locally — " + packing.length + " packing rows");
  view = "orders";
  render();
  e.target.value = "";
});

function parseCsv(text) {
  const lines = text.split(/\r?\n/);
  let headerIdx = lines.findIndex((l) => l.toLowerCase().includes("order no") && l.toLowerCase().includes("customer"));
  if (headerIdx < 0) headerIdx = 0;
  const split = (row) => row.split(";").map((c) => c.trim());
  const headers = split(lines[headerIdx]);
  const idx = (name) => headers.findIndex((h) => h.toLowerCase() === name.toLowerCase());
  const packing = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const cols = split(lines[i]);
    if (!cols[0] || !/^\d+$/.test(cols[0])) continue;
    const g = (n) => cols[idx(n)] || "";
    packing.push({
      orderNo: g("Order no."),
      customerName: g("Customer name"),
      boxes: Number(g("No of boxes")) || 0,
      floorPallets: Number(g("Floor pallets")) || 0,
      totalPallets: Number(g("Total pallets")) || 0,
      pallet: g("Pallet name"),
      boxesPerPallet: Number(g("Boxes per pallet")) || 0,
      box: g("Box name"),
      unitsPerBox: Number(g("Units per box")) || 0,
      packing: g("Packing name"),
      product: g("Product name"),
      lot: g("Lot no."),
      orderDate: g("Order date"),
      packingDate: g("Packing date"),
      deliveryDate: g("Delivery date"),
      internalRef: g("Internal reference"),
      customerRef: g("Customer reference"),
      customerNo: g("Customer no."),
      customerId: String(g("Customer ID")).replace(/\.$/, ""),
      packingCode: String(Number(g("Packing  code") || g("Packing code")) || ""),
      origin: g("Origin"),
      productCode: String(Number(g("Product code")) || g("Product code")),
      ean: g("EAN"),
      gtin: g("GTIN"),
      finalGtin: g("Final GTIN"),
      sscc: g("SSCC"),
      warehouseNo: String(Number(g("Warehouse no.")) || 1),
      shipFrom: g("Departure warehouse"),
      address: g("Address"),
      delivery: g("Delivery address"),
      bbd: g("Best before"),
      description: g("Final description"),
      dessin: g("Dessin"),
      netKg: Number(g("Net weight in Kg")) || 0,
      packingDay: g("Packing day no.")
    });
  }
  return packing;
}
